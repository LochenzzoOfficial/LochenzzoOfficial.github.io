.calendar{

display:grid;

grid-template-columns:
repeat(7, 1fr);

gap:20px;

width:90%;

margin:50px auto;
}

.day{

background:
rgba(255,170,0,0.08);

border:
1px solid rgba(255,170,0,0.3);

border-radius:20px;

padding:20px;

min-height:120px;

box-shadow:
0 0 10px rgba(255,170,0,0.2);

transition:0.3s;
}

.day:hover{

transform:scale(1.05);

box-shadow:
0 0 25px rgba(255,170,0,0.6);

}

.stream{

margin-top:10px;

color:
rgb(255,190,50);
}
    
.stream{
    color:rgb(255,190,50);

}

    color:red;

    text-shadow:
    0 0 10px red;

    display:inline-block;

    margin:40px;

<body>

<h1>HARMONOGRAM STREAMÓW</h1>
<h1>HARMONOGRAM STREAMÓW</h1>

<div class="calendar-header">

<button onclick="changeMonth(-1)">
⬅
</button>

<h2 id="month-name">
Maj 2026
</h2>

<button onclick="changeMonth(1)">
➡
</button>

</div>

<div class="calendar" id="calendar">

</div>

<a class="back-button" href="glowna.html">
Powrót do strony głównej
</a>

<script>

const months = [
"Styczeń",
"Luty",
"Marzec",
"Kwiecień",
"Maj",
"Czerwiec",
"Lipiec",
"Sierpień",
"Wrzesień",
"Październik",
"Listopad",
"Grudzień"
];

let currentMonth = 4;
let currentYear = 2026;

function renderCalendar(){

const calendar =
document.getElementById("calendar");

calendar.innerHTML = "";

document.getElementById("month-name")
.innerText =
months[currentMonth] + " " + currentYear;

const daysInMonth =
new Date(
currentYear,
currentMonth + 1,
0
).getDate();

for(let i = 1; i <= daysInMonth; i++){

const day =
document.createElement("div");

day.classList.add("day");

day.innerHTML = `
<h3>${i}</h3>
`;

if(i === 6 || i === 14 || i === 21){

day.innerHTML += `
<div class="stream">
🔴 LIVE 20:00
</div>
`;

}

calendar.appendChild(day);

}

}

function changeMonth(step){

currentMonth += step;

if(currentMonth > 11){

currentMonth = 0;
currentYear++;

}

if(currentMonth < 0){

currentMonth = 11;
currentYear--;

}

renderCalendar();

}

renderCalendar();

</script>

</body>
