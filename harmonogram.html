<style>

body{
    background:black;
    color:white;
    font-family:'Orbitron', sans-serif;
    margin:0;
    padding:0;
    text-align:center;
}

h1{
    margin-top:40px;
    font-size:60px;

    color:rgb(255,170,0);

    text-shadow:

    0 0 40px rgba(255,120,0,0.6);
}

.calendar{

    display:grid;

    grid-template-columns:

    gap:20px;

    width:90%;

    margin:50px auto;
}

.day{

    background:

    border:

    border-radius:20px;

    padding:20px;

    min-height:130px;

    box-shadow:
    0 0 15px rgba(255,170,0,0.2);

    transition:0.3s;
}

.day:hover{

    transform:scale(1.05);

    box-shadow:
    0 0 25px rgba(255,170,0,0.5);
}

.stream{
    color:rgb(255,190,50);
    margin-top:10px;
}

.live{

    color:red;

    text-shadow:
    0 0 10px red;
}

.back-button{

    display:inline-block;

    margin:40px;

    padding:15px 35px;

    background:rgb(255,220,120);

    color:black;

    border-radius:15px;

    text-decoration:none;

    font-weight:bold;

    box-shadow:
    0 0 10px rgba(255,200,0,0.8),
    0 0 20px rgba(255,170,0,0.5);
}

</style>
</head>
