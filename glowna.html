<!DOCTYPE html>
<html lang="pl">
<head>

<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lochenzzo - Strona Główna</title>

<style>

body{
    background-color: black;
    color: white;
    font-family: Orbitron, sans-serif;
    margin: 0;
    padding: 0;
}

nav{
    background-color: rgb(0, 0, 0);
    padding: 20px;
    text-align: center;
}

nav a{
    color: black;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    margin: 10px;
    font-weight: 700;
    font-size: 20px;
    font-family: 'Orbitron', sans-serif;
}

section{
    padding: 100px 30px;
    text-align: center;
}

h1{
    font-size: 60px;
}

.menu-button {

display: inline-block;
margin: 15px;
padding: 15px 25px;
letter-spacing: 1px;

background-color: rgb(206, 143, 26);
color: black;

text-decoration: none;
font-weight: bold;
border-radius: 10px;

transition: all 0.3s ease;
cursor: pointer;

box-shadow: 0 0 25px rgba(255,170,0,0.9);
}

.menu-button:hover {

background-color: rgb(255,120,0);
color: white;
transform: scale(1.08);
box-shadow: 0 0 35px rgba(255,120,0,1);

}

</style>
</head>

<body>


<nav>
    <a class="menu-button" href="#harmonogram">Harmonogram</a>
    <a class="menu-button" href="#kafejka">Kafejka</a>
    <a class="menu-button" href="#aktualnosci">Aktualności</a>
    <a class="menu-button" href="#kontakt">Gdzie mnie znaleźć</a>
</nav>

<section>
    <h1>Witaj na oficjalnej stronie Lochenzzo</h1>

    <p>
        Streamy, gaming, aktualności i społeczność w jednym miejscu.
    </p>
</section>


</body>
